name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lua 5.1 (the version WoW uses)
        run: sudo apt-get update && sudo apt-get install -y lua5.1
      - name: Syntax check
        run: find . -type f -name '*.lua' -print0 | xargs -0 -n 1 luac5.1 -p
      - name: Translations complete
        run: lua5.1 tests/check_locales.lua
      - name: Play-through tests in every language
        run: |
          for l in enUS deDE frFR esES esMX ptBR ruRU zhCN zhTW koKR; do
            echo "== $l"
            WT_LOCALE=$l lua5.1 tests/run_tests.lua
          done
      - name: Game API use
        run: lua5.1 tests/check_api.lua
      - name: Route seed names and format
        run: lua5.1 tests/check_seeds.lua
      - name: All play-through suites
        run: |
          for f in tests/run_*.lua; do
            echo "== $f"
            lua5.1 "$f"
          done
      - name: Positions as plain tables (as in WoW Forever)
        run: |
          for f in run_tests run_bare run_travel run_map run_routemap run_routepreview; do
            echo "== $f (plain vectors)"
            WT_PLAIN_VECTORS=1 lua5.1 "tests/$f.lua"
          done
      - name: Optional UI and delayed world map
        run: |
          for f in run_tab_waypoints run_tab_find run_editmode run_minimap run_widgets run_routemap run_routepreview; do
            lua5.1 "tests/$f.lua" --bare
          done
          lua5.1 tests/run_map.lua --legacy
          lua5.1 tests/run_map.lua --delayed
          lua5.1 tests/run_map.lua --coords-on
          lua5.1 tests/run_map.lua --global-cvars
      - name: All Lua check gates
        run: |
          for f in tests/check_*.lua; do
            # This helper receives map/probe input from validate_terrain_geometry.py.
            if [ "$f" = tests/check_terrain_runtime.lua ]; then
              python3 -B tools/validate_terrain_geometry.py --lua lua5.1
            else
              lua5.1 "$f"
            fi
          done
      - name: Data, runtime audits and Python regression tests
        env:
          LUA51: lua5.1
        run: |
          python3 -B tools/validate_data.py
          python3 -B tools/validate_runtime.py all --reviews tools/validate_runtime_reviews.json
          for f in tests/check_*.py; do
            python3 -B "$f"
          done
